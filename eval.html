<style>
  :root{--bg:#faf6f0;--card:#fff;--line:#E4D5BE;--ink:#3d3529;--sub:#8C8071;--green:#7C9473;--soft:#E3EADD;
    --red:#dc2626;--redbg:#fee2e2;--org:#b45309;--orgbg:#fef3c7;--blue:#1d4ed8;--bluebg:#dbeafe;--ok:#15803d;--okbg:#dcfce7}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',system-ui,sans-serif;font-size:14px}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
  @media (hover:none) and (pointer:coarse){input,select,textarea{font-size:16px}}
  #app{zoom:var(--z, 1)}
  .top{background:#efe6da;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .brand{font-weight:700;font-size:15px;margin-right:6px;display:flex;align-items:center;gap:8px}
  .brand img{width:30px;height:30px;object-fit:contain}
  .gate .logo{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 10px}
  .brand a{color:var(--sub);font-weight:400;font-size:12px;margin-left:8px;text-decoration:none}
  .tabbtn{border:none;background:transparent;padding:8px 12px;border-radius:10px;color:#5a4a3a}
  .tabbtn.on{background:rgba(124,148,115,.2);color:var(--green);font-weight:700}
  .grow{flex:1}
  .inp{padding:7px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0}
  .inp.bad{border-color:var(--red);background:var(--redbg)}
  .btn{background:var(--green);color:#fff;border:none;padding:8px 16px;border-radius:10px;font-weight:500;white-space:nowrap}
  .btn.gray{background:#A69C8E}.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.red{background:var(--red)}.btn.sm{padding:4px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:default}
  .page{padding:14px 14px 110px;max-width:1600px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  h2{margin:0 0 4px;font-size:19px} h3{margin:0 0 10px;font-size:15px}
  .sub{color:var(--sub);font-size:12px}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:12px;font-weight:600;white-space:nowrap}
  .t-new{background:var(--bluebg);color:var(--blue)}.t-close{background:#f1f5f9;color:#64748b}.t-ev{background:var(--soft);color:var(--green)}
  .t-warn{background:var(--redbg);color:var(--red)}.t-ok{background:var(--okbg);color:var(--ok)}.t-org{background:var(--orgbg);color:var(--org)}
  .tw{overflow:auto;border:1px solid var(--line);border-radius:14px;max-height:calc((100vh - 210px) / var(--z, 1));background:#fff}
  table.grid{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%}
  .grid th{position:sticky;top:0;background:#f4ede3;font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
  .grid td{padding:6px 8px;border-bottom:1px solid #f0e8dc;white-space:nowrap;vertical-align:middle}
  .grid tr.click:hover td{background:#FBF3E6;cursor:pointer}
  .grid td.num{text-align:right;font-variant-numeric:tabular-nums}
  .grid tr.curmonth td{background:#fff3c4;font-weight:700;border-top:2px solid #e8b931;border-bottom:2px solid #e8b931}
  .grid th.num{text-align:right}
  .cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:12px}
  @media (max-width:900px){.cols2{grid-template-columns:minmax(0,1fr)}}
  .grid td.flag{background:var(--redbg);color:var(--red);font-weight:700}
  .grid td.need{background:#fff7ed}
  .grid td .inp{padding:4px 8px;border-radius:8px;font-size:13px}
  .grid th .hint{font-weight:400;color:var(--sub);font-size:11px;display:block}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
  .chip b{display:block;font-size:18px;color:var(--green)}
  .modal{position:fixed;inset:0;background:rgba(61,53,41,.35);z-index:100;display:flex;justify-content:flex-end}
  .drawer{background:var(--bg);width:min(980px,100%);height:100%;overflow:auto;padding:16px;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
  .form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 12px}
  .form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub)}
  .form label .inp{color:var(--ink)}
  .form label .ampm{align-self:flex-start}
  .sect{font-weight:700;color:var(--green);margin:16px 0 8px}
  .choice{display:flex;gap:10px;flex-wrap:wrap}
  .choice button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 18px;font-size:15px;font-weight:700;color:var(--ink);text-align:left;min-width:180px}
  .choice button span{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:2px}
  .choice button.on{border-color:var(--green);background:var(--soft);color:var(--green)}
  .choice button:hover:not(.on){background:#FBF3E6}
  .picks{display:flex;flex-direction:column;gap:4px;margin-top:8px;max-width:520px}
  .picks button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;text-align:left;font-size:13px}
  .picks button:hover{background:#FBF3E6;border-color:var(--green)}
  .numlink{border:none;background:none;padding:2px 6px;border-radius:6px;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted #c9b896;text-underline-offset:3px}
  .numlink:hover{background:var(--soft)}
  .numlink.on{background:var(--green);color:#fff;text-decoration:none}
  .fstats{position:fixed;right:16px;bottom:16px;z-index:900;display:flex;gap:10px}
  .fstats button{width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
  .fstats button span{font-size:11px;color:var(--sub);line-height:1.2}
  .fstats button b{font-size:19px;color:var(--green);line-height:1.2}
  .fstats button:hover{background:#FBF3E6}
  .fstats button.on{background:var(--green);border-color:var(--green)}.fstats button.on span,.fstats button.on b{color:#fff}
  .fpanel{position:fixed;right:16px;bottom:96px;z-index:900;width:min(760px,calc(100vw - 32px));background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  @media (max-width:700px){.fstats{gap:6px}.fstats button{width:56px;height:56px}.fstats button b{font-size:16px}.fstats button span{font-size:10px}}
  .trigbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .trigbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink)}
  .trigbar button b{margin-left:6px;color:var(--green)}

<div class="fz" title="調整字體大小">
  <button id="fzDown" aria-label="縮小字體">A−</button>
  <span class="lv" id="fzLv" title="恢復預設大小"></span>
  <button id="fzUp" aria-label="放大字體">A＋</button>
</div>
<script>
(function(){
  var KEY = 'evalZoom', DEF = 1, MIN = 0.8, MAX = 1.6, STEP = 0.1, z = DEF;
  try{ var v = parseFloat(localStorage.getItem(KEY)); if(v >= MIN && v <= MAX) z = v; }catch(e){}
  function apply(){
    z = Math.round(Math.min(MAX, Math.max(MIN, z)) * 100) / 100;
    document.documentElement.style.setProperty('--z', z);
    document.getElementById('fzLv').textContent = Math.round(z * 100) + '%';
    try{ localStorage.setItem(KEY, z); }catch(e){}
  }
  document.getElementById('fzDown').onclick = function(){ z -= STEP; apply(); };
  document.getElementById('fzUp').onclick = function(){ z += STEP; apply(); };
  document.getElementById('fzLv').onclick = function(){ z = DEF; apply(); };
  apply();
})();
</script>

// ---------- 日期 ----------
// 一律存成西元 'YYYY-MM-DD'；接受民國 115/10/12、115.10.12、1151012、115年10月12日、西元、Excel 日期序號
function parseDate(x) {
  if (x === null || x === undefined || x === '') return '';
  if (x instanceof Date && !isNaN(x)) return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())}`;
  if (typeof x === 'number') {
    if (x > 20000 && x < 80000) { // Excel 序號
      const d = new Date(Date.UTC(1899, 11, 30) + x * 86400000);
      return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
    }
    x = String(x);
  }
  let s = String(x).trim().replace(/[年月.\-－／\s]/g, '/').replace(/日/g, '').replace(/\/+/g, '/').replace(/\/$/, '');
  let y, m, d, mm;
  if ((mm = s.match(/^(\d{2,4})\/(\d{1,2})\/(\d{1,2})$/))) { y = +mm[1]; m = +mm[2]; d = +mm[3]; }
  else if ((mm = s.match(/^(\d{3})(\d{2})(\d{2})$/))) { y = +mm[1]; m = +mm[2]; d = +mm[3]; }
  else if ((mm = s.match(/^(\d{4})(\d{2})(\d{2})$/))) { y = +mm[1]; m = +mm[2]; d = +mm[3]; }
  else return '';
  if (y < 1000) y += 1911;
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return '';
  return `${y}-${pad(m)}-${pad(d)}`;
}
const toUTC = iso => { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const fromUTC = t => { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const addDays = (iso, n) => fromUTC(toUTC(iso) + n * 86400000);
const calDays = (a, b) => (a && b) ? Math.round((toUTC(b) - toUTC(a)) / 86400000) : null;
const weekday = iso => new Date(toUTC(iso)).getUTCDay();
function addMonths(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1 + n, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(Math.min(d, last))}`;
}
// 民國顯示
function roc(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${+y - 1911}/${m}/${d}`; }
function rocMonth(mk) { const [y, m] = mk.split('-'); return `${+y - 1911}年${+m}月`; }
const monthOf = iso => iso ? iso.slice(0, 7) : '';
function shiftMonth(mk, n) { return addMonths(mk + '-01', n).slice(0, 7); }

// ---------- 工作天 ----------
// holidays：{ 'YYYY-MM-DD': '假日' | '颱風假' | '補班' }
function isWorkday(iso, holidays) {
  const k = holidays[iso];
  if (k === '補班') return true;
  if (k) return false;
  const w = weekday(iso);
  return w !== 0 && w !== 6;
}
// 起算日當天不算，從隔天數到截止日（含）。截止日早於起算日時回傳負數。
function workDays(a, b, holidays) {
  if (!a || !b) return null;
  if (a === b) return 0;
  const sign = b > a ? 1 : -1;
  let [from, to] = sign > 0 ? [a, b] : [b, a];
  let n = 0, d = addDays(from, 1);
  for (let guard = 0; d <= to && guard < 4000; guard++, d = addDays(d, 1)) if (isWorkday(d, holidays)) n++;
  return n * sign;
}
// 兩日期相差的「月+天」文字，以及是否超過 n 個月（期限 = 起算日加 n 個月的同一日）
function monthSpan(a, b) {
  if (!a || !b) return '';
  let months = 0;
  while (addMonths(a, months + 1) <= b) months++;
  const days = calDays(addMonths(a, months), b);
  return (months ? `${months}個月` : '') + (days || !months ? `${days}天` : '');
}
const overMonths = (a, b, n) => !!(a && b && b > addMonths(a, n));

// ---------- 時間（HH:MM） ----------
// 接受 10:30、1030、10點30、上午10點、下午3:00、Excel 時間小數
function parseTime(x) {
  if (x === null || x === undefined || x === '') return '';
  if (typeof x === 'number') {
    const f = x % 1; if (!f) return '';
    const m = Math.round(f * 1440); return `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
  }
  let s = String(x).trim().replace(/：/g, ':').replace(/\s+/g, '');
  const pm = /下午|晚上|PM/i.test(s), am = /上午|早上|凌晨|AM/i.test(s);
  s = s.replace(/上午|下午|早上|晚上|凌晨|AM|PM/gi, '');
  let mm = s.match(/(\d{1,2})[:點時](\d{1,2})?分?$/) || s.match(/^(\d{1,2})(\d{2})$/) || s.match(/^(\d{1,2})$/);
  if (!mm) return '';
  let h = +mm[1], mi = +(mm[2] || 0);
  if (pm && h < 12) h += 12;
  if (am && h === 12) h = 0;
  if (h > 23 || mi > 59) return '';
  return `${pad(h)}:${pad(mi)}`;
}
// 從「日期 時間」文字裡取出時間（例：115/10/14 10:30）
function timeFromText(x) {
  if (typeof x === 'number') return parseTime(x);
  const m = String(x || '').trim().match(/^\S+?(?:\s+|(?=上午|下午|早上|晚上))(.+)$/);
  return m ? parseTime(m[1]) : '';
}
// 中午 12 點分界的工作天：每個「天」是前一個工作天中午 12 點到當天中午 12 點。
// 起點那一段算第 1 天。例：10/14 10:00 審核 → 10/14 12:00 前完成是第 1 天，10/14 12:00～10/15 12:00 是第 2 天。
// 週末、國定假日、颱風假不算；12:00 整點算下一天。沒填時間時當作上午。
// 上午／下午：存「上午」或「下午」；舊資料或匯入的 HH:MM 也看得懂
const AMPM = ['上午', '下午'];
const isPM = t => t === '下午' || (/^\d{2}:\d{2}$/.test(t || '') && t >= '12:00');
const toAmPm = t => !t ? '' : AMPM.includes(t) ? t : isPM(t) ? '下午' : '上午';
function noonWindow(date, time, H) {
  if (isWorkday(date, H) && !isPM(time)) return date;
  let d = addDays(date, 1);
  for (let g = 0; !isWorkday(d, H) && g < 60; g++) d = addDays(d, 1);
  return d;
}
function noonDays(d1, t1, d2, t2, H) {
  if (!d1 || !d2) return null;
  const a = noonWindow(d1, t1, H), b = noonWindow(d2, t2, H);
  if (b < a) return workDays(a, b, H);   // 順序錯誤，回傳負數
  return workDays(a, b, H) + 1;
}

// 統一寫法：去空白、全形符號轉半形、「轉入AA01」補上 -
function normTrigger(t) {
  let s = String(t || '').replace(/\s+/g, '').replace(/[－—–]/g, '-').replace(/ＡＡ/g, 'AA').toUpperCase().replace(/^新案-轉入(?!-)/, '新案-轉入-');
  if (/^-*$/.test(s)) return '';   // 「-」代表本月沒有觸發
  return s;
}

// 結案觸發：
//   「結案-」「結案400-」＝本月結案
//   「10月結案」「10月結案-」（有沒有 - 都一樣）＝10 月已結案、本月只是還留在總表
//   「上月結案」＝上個月
function closeMonthOf(t, evMonth) {
  t = normTrigger(t);
  let m = t.match(/^(\d{1,2})月結案/);
  if (m) {
    const n = +m[1], [y, em] = evMonth.split('-').map(Number);
    if (n < 1 || n > 12) return '';
    return `${n > em ? y - 1 : y}-${pad(n)}`;
  }
  if (t.startsWith('上月結案')) return shiftMonth(evMonth, -1);
  if (t.startsWith('結案')) return evMonth;
  return '';
}
const isCloseTrigger = t => /^((\d{1,2}月)|上月)?結案/.test(normTrigger(t));

const normName = s => String(s || '').replace(/[\s ]/g, '').replace(/⾧/g, '長').replace(/^雲林縣-/, '').replace(/（/g, '(').replace(/）/g, ')');
// units：[{ name, short, aliases:[] }]；回傳統一後的顯示名稱（有簡稱用簡稱）
function makeUnitResolver(units) {
  const exact = new Map(), list = [];
  for (const u of units) {
    const show = u.short || u.name;
    for (const n of [u.name, u.short, ...(u.aliases || [])]) if (n) exact.set(normName(n), show);
    if (u.short) list.push([normName(u.short), show]);
  }
  return raw => {
    const n = normName(raw);
    if (!n) return '';
    if (exact.has(n)) return exact.get(n);
    const hit = list.find(([s]) => n.includes(s) || s.includes(n));
    return hit ? hit[1] : String(raw).trim();
  };
}

function avg(rows, f) {
  const xs = rows.map(f).filter(x => typeof x === 'number');
  return xs.length ? Math.round(xs.reduce((a, b) => a + b, 0) / xs.length * 10) / 10 : '—';
}
function rate(rows, f, ok) {
  const xs = rows.map(f).filter(x => typeof x === 'number');
  return xs.length ? `${Math.round(xs.filter(ok).length / xs.length * 1000) / 10}%（${xs.filter(ok).length}/${xs.length}）` : '—';
}

// db：{ cases: Map(id→case), events: [event], holidays: {date→kind}, resolveUnit }
// 事件 event = { _id, caseId, month, ...欄位 }；個案 case = { _id, caseNo, ...欄位 }
function buildReport(key, month, db) {
  const R = REPORTS[key];
  const evs = db.events.filter(e => e.month === month && R.filter(e) && db.cases.has(e.caseId));
  evs.sort((a, b) => String(db.cases.get(a.caseId).caseNo).localeCompare(String(db.cases.get(b.caseId).caseNo), 'zh-Hant', { numeric: true }));
  const ctx = {
    prevVisit(caseId, mk, before) {
      let best = '';
      for (const e of db.events) if (e.caseId === caseId && e.month < mk && e.visit && (!before || e.visit < before) && e.visit > best) best = e.visit;
      return best;
    },
  };
  const rows = evs.map((e, idx) => {
    const c = db.cases.get(e.caseId);
    const svc = {};
    Object.assign(svc, caseUnits(e, c, db.resolveUnit));
    const r = { i: idx + 1, e, c, caseId: e.caseId, month, svc };
    r.k = R.calc(r, db.holidays, ctx);
    return r;
  });
  return { R, rows, summary: R.summary(rows) };
}
// 報表某一格的顯示文字（畫面與匯出共用）
// 指定／輪派 → 報表的選項文字
const MECH = ['指定', '輪派'];
const mechToOpt = m => m === '指定' ? '1.個案意願' : m === '輪派' ? '2.輪派' : '';
// B單位的派案機制：先看居家（B單位），沒有就看第一個有填的服務項目
function bMechOf(c) {
  const m = (c && c.svcMech) || {};
  if (m.home) return m.home;
  const k = CATS.find(x => m[x.key]); return k ? m[k.key] : '';
}
const editVal = (col, r) => (r.e[col.edit] || (col.fallback ? col.fallback(r) : '') || '');
function cellText(col, r) {
  const val = col.edit ? editVal(col, r) : col.v(r);
  if (val === null || val === undefined) return '';
  if (col.date || col.type === 'date') return roc(val);
  if (col.hide && col.hide(r)) return '';
  if (col.opts === AMPM) return toAmPm(val);
  return String(val);
}

// ---------- 評鑑報表的舊資料（匯入） ----------
// 欄名比對用：去空白、去括號內容、只取第一行（說明文字不算）、去掉「平均天數」等字
const normCol = h => String(h || '').split(/\n/)[0].replace(/\s+/g, '').replace(/[（(].*?[)）]/g, '').replace(/平均天數/g, '').replace(/日期$/, '').replace(/身分證字號/, '身分證號');
const COL_ALIAS = { '個案出院至訪視': '出院至訪視', '訪視日期至計畫通過': '訪視至計畫通過', '個管照會B單位': '個管照會B單位' };
function colMatch(ours, theirs) {
  let a = normCol(ours), b = normCol(theirs); b = COL_ALIAS[b] || b;
  return a === b || (a.length >= 4 && b.length >= 4 && (a.startsWith(b) || b.startsWith(a)));
}
// 從工作表名稱或標題列找出月份（115年10月、10月）
function sheetMonth(name, aoa, fallbackYear) {
  const txt = [name, ...(aoa.slice(0, 2).flat())].map(x => String(x || '')).join(' ');
  let m = txt.match(/(\d{3})\s*年\s*(\d{1,2})\s*月/);
  if (m) return `${+m[1] + 1911}-${pad(+m[2])}`;
  m = String(name).match(/^(\d{1,2})\s*月?$/);
  if (m && fallbackYear) return `${fallbackYear}-${pad(+m[1])}`;
  return '';
}
// 讀一份評鑑報表 Excel（一個月一張工作表）→ { 'YYYY-MM': { head:[欄名], rows:[[值]] } }
function parseReportBook(sheets, fallbackYear) {
  const out = {};
  for (const [name, aoa] of Object.entries(sheets)) {
    const hr = aoa.findIndex(r => r && r.some(x => /^姓名$/.test(String(x || '').trim())));
    if (hr < 0) continue;
    const mk = sheetMonth(name, aoa, fallbackYear); if (!mk) continue;
    const head = aoa[hr].map(x => String(x || '').trim());
    const rows = [];
    for (let i = hr + 1; i < aoa.length; i++) {
      const r = aoa[i] || [];
      const nameCol = head.findIndex(h => h === '姓名'), idCol = head.findIndex(h => /身分證/.test(h));
      if (!String(r[nameCol] ?? '').trim() && !String(r[idCol] ?? '').trim()) continue;
      rows.push(head.map((h, j) => {
        let v = r[j]; if (v === undefined || v === null) return '';
        if (typeof v === 'number' && v > 20000 && v < 80000 && /日期|時間|日$/.test(h.split(/\n/)[0])) return roc(parseDate(v));
        return typeof v === 'number' ? v : String(v).trim();
      }));
    }
    out[mk] = { head, rows };
  }
  return out;
}
// 把舊資料的一列對到系統報表的欄位
function histRowFor(R, hist, row) {
  return R.cols.map(c => {
    if (c.opts === AMPM) return '';                      // 舊表沒有上下午欄
    let j = hist.head.findIndex(h => { const b = normCol(h); return normCol(c.h) === (COL_ALIAS[b] || b); });
    if (j < 0) j = hist.head.findIndex(h => colMatch(c.h, h));
    return j < 0 ? '' : row[j];
  });
}

// ---------- 服務單位統計 ----------
// kind：'new' 新案 / 'reassess' 複評；回傳 { [類別key]: { [單位]: 件數 } }
// 總表服務欄位裡不是單位名稱的寫法（僅交通、僅日照、無、-…）
const NOT_UNIT = /^(僅|只有|無$|-+$|\/$|暫停|待)/;
const isUnitName = v => { const s = String(v || '').replace(/\s+/g, ''); return !!s && !NOT_UNIT.test(s); };
// 「僅交通」「僅日照」→ 指向哪個服務類別
function onlyCatOf(v) {
  const s = String(v || '').replace(/\s+/g, '').replace(/^(僅|只有)/, '');
  if (!s || s === String(v || '').replace(/\s+/g, '')) return null;
  const alias = { 送餐: 'meal', 餐飲: 'meal', 營養餐飲: 'meal', 專業: 'prof', 復能: 'prof', 日照喘息: 'dayresp', 機構喘息: 'inst', 居家喘息: 'resp', 居家: 'home', 居服: 'home' };
  if (alias[s]) return alias[s];
  const hit = CATS.find(c => s === c.label || s === c.stat || s === c.col || s.startsWith(c.label));
  return hit ? hit.key : null;
}
// 一個個案在某個月各服務類別的單位（不是單位名稱的不算；「僅交通」但交通欄沒填 → 交通記「（未填單位）」）
function caseUnits(e, c, resolveUnit) {
  const out = {}, src = k => (e && (e.services || {})[k]) || (c.services || {})[k] || '';
  for (const cat of CATS) { const raw = src(cat.key); if (isUnitName(raw)) out[cat.key] = resolveUnit(raw); }
  for (const cat of CATS) { const t = onlyCatOf(src(cat.key)); if (t && !out[t]) out[t] = '（未填單位）'; }
  return out;
}
function unitStats(kind, month, db) {
  // 新案：觸發是「新案-」開頭的全部項目；複評：只算「複評」（新案-複評等排除）
  const f = unitStatFilter(kind);
  const out = {};
  for (const e of db.events) {
    if (e.month !== month || !f(e) || !db.cases.has(e.caseId)) continue;
    const c = db.cases.get(e.caseId);
    for (const [k, u] of Object.entries(caseUnits(e, c, db.resolveUnit))) (out[k] = out[k] || {})[u] = (out[k][u] || 0) + 1;
  }
  return out;
}

const unitStatFilter = kind => kind === 'new' ? (e => normTrigger(e.trigger).startsWith('新案')) : (e => normTrigger(e.trigger) === '複評');
const UNIT_SHEETS = {
  new: ['B單位', 'C碼', '交通', '社區交通', '日喘', '居喘', '日照', '小規機', '機喘', '家托', '餐飲(OT)', '沐浴車', '輔具', '短照'],
  reassess: ['B單位', 'C碼', '交通', '居喘', '日照', '日喘', '短照', '機喘', '餐飲(OT)', '家托', '沐浴車', '輔具'],
};
const STAT2CAT = Object.fromEntries(CATS.map(c => [c.stat, c.key]));
// 讀舊的服務單位統計 Excel：每張工作表＝一個服務類別，第一列是單位全名，A 欄是「111/09」這種月份
function parseUnitStatBook(sheets) {   // sheets: { 工作表名: aoa }
  const order = {}, counts = {}, sheetOrder = [];
  for (const [name, aoa] of Object.entries(sheets)) {
    const cat = String(name).trim(); if (!STAT2CAT[cat] || !aoa.length) continue;
    sheetOrder.push(cat);
    const head = (aoa[0] || []).map(x => String(x || '').replace(/\s+/g, ' ').trim());
    order[cat] = head.slice(1).filter(Boolean);
    counts[cat] = {};
    for (let i = 1; i < aoa.length; i++) {
      const row = aoa[i] || [], m = String(row[0] || '').trim().match(/^(\d{2,3})\/(\d{1,2})$/);
      if (!m) continue;
      const mk = `${+m[1] + 1911}-${pad(+m[2])}`, o = {};
      head.forEach((h, j) => { if (j && h && typeof row[j] === 'number' && row[j]) o[h] = row[j]; });
      counts[cat][mk] = o;
    }
  }
  return { sheetOrder, order, counts };
}
// 組出服務單位統計表：每個類別一張，欄＝單位（舊檔的順序在前，新出現的接在後面），列＝月份
//   某個月系統裡有該類觸發資料 → 用系統計算；沒有 → 用匯入的舊數字
function unitStatBook(kind, db, hist, toMonth) {
  hist = hist || { sheetOrder: [], order: {}, counts: {} };
  const f = unitStatFilter(kind), sysMonths = new Set();
  for (const e of db.events) if (db.cases.has(e.caseId) && f(e)) sysMonths.add(e.month);
  const histMonths = new Set(Object.values(hist.counts).flatMap(o => Object.keys(o)));
  const allMonths = [...sysMonths, ...histMonths].sort();
  const start = allMonths[0] || toMonth.slice(0, 4) + '-01';
  const months = []; for (let m = start; m <= `${toMonth.slice(0, 4)}-12`; m = shiftMonth(m, 1)) months.push(m);
  const fullOf = u => { const hit = (db.units || []).find(x => (x.short || x.name) === u); return hit ? hit.name : u; };
  const sheets = [...new Set([...(hist.sheetOrder.length ? hist.sheetOrder : UNIT_SHEETS[kind]), ...UNIT_SHEETS[kind]])];
  const sysByMonth = {}; for (const m of sysMonths) sysByMonth[m] = unitStats(kind, m, db);
  return sheets.map(cat => {
    const cols = [...(hist.order[cat] || [])], colKey = cols.map(c => db.resolveUnit(c));
    const rows = months.map(m => {
      const v = {};
      if (sysMonths.has(m)) {
        for (const [u, n] of Object.entries((sysByMonth[m][STAT2CAT[cat]] || {}))) {
          let j = colKey.indexOf(u);
          if (j < 0) { cols.push(fullOf(u)); colKey.push(u); j = cols.length - 1; }
          v[cols[j]] = (v[cols[j]] || 0) + n;
        }
        return { m, src: '系統', v };
      }
      const h = (hist.counts[cat] || {})[m];
      return { m, src: h ? '匯入' : '', v: h ? { ...h } : {} };
    });
    return { cat, cols, rows };
  });
}

// ---------- 月統計（在案、新案、結案、最新總數） ----------
// 開案月 = 第一筆新案觸發的月份，沒有則用開案日期、申請日期
// 結案月 = 第一筆結案觸發的月份
function caseMonths(db) {
  const info = new Map();
  for (const [id, c] of db.cases) info.set(id, { open: monthOf(c.openDate) || monthOf(c.applyDate) || '', close: '' });
  const evs = [...db.events].sort((a, b) => a.month.localeCompare(b.month));
  for (const e of evs) {
    const x = info.get(e.caseId); if (!x) continue;
    // 新案觸發：第一次開案，或結案後又重開（沿用尾數 2 的同一筆）→ 從這個月重新起算
    if (isNewTrigger(e.trigger) && (!x.openEv || (x.close && x.close < e.month))) { x.open = e.month; x.openEv = true; x.close = ''; }
    const cm = closeMonthOf(e.trigger, e.month);
    if (cm && (!x.close || cm < x.close) && !(x.openEv && cm < x.open)) x.close = cm;
  }
  // 沒打結案觸發，但 A結束服務日期、系統結案日期都填了 → 以較晚的日期月份當結案月
  for (const [id, c] of db.cases) {
    const x = info.get(id), done = closedOffMonth(c);
    if (!x.close && done && !(x.open && done < x.open)) x.close = done;
  }
  return info;
}
// 兩個結案日期都填了 → 回傳較晚那天的月份（這個月還在總表，下個月起移到結案表）
function closedOffMonth(c) {
  if (!c.aEnd || !c.sysClose) return '';
  return monthOf(c.aEnd > c.sysClose ? c.aEnd : c.sysClose);
}
// 某月是否還顯示在總表（含已結案但還沒補齊兩個結案日期的個案）
function inSummaryList(c, x, month) {
  if (x.open && x.open > month) return false;
  if (!x.close || x.close >= month) return true;
  const off = closedOffMonth(c);
  return !(off && off < month);
}
// 本月沒有自己打觸發時，系統自動帶入的觸發：
//   之前月份結案、還在總表上 → 「11月結案」
//   上個月有觸發（不是「-」、不是結案），但沒選金額或沒吃到錢 → 本月補報：

  for (const [id] of db.cases) {

    if (x.close && x.close < month) continue;          // 之前已結案、不在本月總表
    const e = evOf.get(id) || null;
    const t = (e ? normTrigger(e.trigger) : '') || auto.get(id) || '';
    const k = e && FEE[e.fee] ? e.fee : defaultFee(t);
    const r = by.get(t || NO_TRIG) || { t: t || NO_TRIG, n: 0, c: {}, amt: 0, ids: {} };
    r.n++; r.c[k] = (r.c[k] || 0) + 1; (r.ids[k] = r.ids[k] || []).push(id);
    if (FEE[k]) r.amt += FEE[k].amt;

  const rows = [...by.values()].sort((a, b) => order(a.t) - order(b.t) || b.n - a.n);

// 第一次開啟會下載全部資料，之後只下載別人改過的部分，大幅節省 Convex 免費額度。
const IDB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open('evalCache', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async get(k) { try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch (e) { return undefined; } },
  async set(k, v) { try { const db = await this.open(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch (e) { } },
  async clear() { try { const db = await this.open(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').clear(); t.oncomplete = res; t.onerror = res; }); } catch (e) { } },
};
const TABLES = ['cases', 'events', 'units', 'holidays', 'closures', 'kv'];
const CACHE_KEY = 'cache:' + EVAL_URL;
const store = { rows: { cases: new Map(), events: new Map(), units: new Map(), holidays: new Map(), closures: new Map(), kv: new Map() }, since: { cases: 0, events: 0, units: 0, holidays: 0, closures: 0, kv: 0 } };
async function loadCache() {
  const c = await IDB.get(CACHE_KEY);
  if (!c) return;
  for (const t of TABLES) { store.rows[t] = new Map(((c.rows || {})[t] || []).map(x => [x._id, x])); store.since[t] = (c.since || {})[t] || 0; }
}
let syncing = null;
async function syncAll() {
  if (syncing) return syncing;
  syncing = (async () => {
    let changed = 0;
    for (const t of TABLES) {
      let cursor = null, max = store.since[t];
      for (; ;) {
        const r = await call('q', 'data:sync', { table: t, since: store.since[t], paginationOpts: { numItems: 500, cursor } });
        for (const x of r.page) {
          const old = store.rows[t].get(x._id);
          if (!old || old.updatedAt !== x.updatedAt || old.d !== x.d || old.deleted !== x.deleted) changed++;
          if (x.deleted) store.rows[t].delete(x._id); else store.rows[t].set(x._id, x);
          if (x.updatedAt > max) max = x.updatedAt;
        }
        if (r.isDone) break;
        cursor = r.continueCursor;
      }
      store.since[t] = max;
    }
    if (changed) await IDB.set(CACHE_KEY, { since: store.since, rows: Object.fromEntries(TABLES.map(t => [t, [...store.rows[t].values()]])) });
    return changed;
  })().finally(() => { syncing = null; });
  return syncing;
}

const SUMMARY_HEAD = ['編號', '觸發', '申請來源', '申請來源備註', 'A結束服務日期', '系統結案日期', '姓名', '性別', '身分證號', '出生日期', '年齡', 'CMS', '身分別', '居住', '失智', '身障', '身障等級',
  '申請日期', '開案日期', '指派A單位日期', '照專評估日期\n(最新)', '訪視日期\n(最新)', '送審日期\n(最新)', '督導簽審日期\n(最新)', '審核日期\n(最新)', '照會B單位\n(最新)',
  '居服單位', '居服進場時間', '服務代碼\n(最新)', '沐浴車', '交通', '居喘', '復能', '送餐', '日照', '日照喘息', '家托', '小規機', '機構喘息', '短照(S)', '服務項目數\n(最新)',
  '居住地', '地址', '聯絡人', '聯絡電話', '核銷金額', '出院日期', 'B單位第一次服務日期', '結案原因'];
const SVC_COLS = ['bath', 'traffic', 'resp', 'prof', 'meal', 'day', 'dayresp', 'family', 'small', 'inst', 'short'];
function summaryAoa(db, month) {
  const evOf = new Map(); for (const e of db.events) if (e.month === month) evOf.set(e.caseId, e);
  const auto = autoTriggers(month, db), bill = new Map();
  const b = billing(month, db); for (const r of b.rows) for (const [k, ids] of Object.entries(r.ids)) for (const id of ids) bill.set(id, k);
  const cases = [...db.cases.values()].filter(c => inSummaryList(c, db.info.get(c._id) || {}, month)).sort(sortNo);
  const end = month + '-28', age = bd => { if (!bd) return ''; let a = +end.slice(0, 4) - +bd.slice(0, 4); if (end.slice(5) < bd.slice(5)) a--; return a; };
  const rows = cases.map(c => {
    const e = evOf.get(c._id) || {}, L = k => roc(latestOf(db, c, k, month)), sv = c.services || {}, es = e.services || {};
    const svc = k => es[k] || sv[k] || '';
    const fk = bill.get(c._id);
    return [c.caseNo, normTrigger(e.trigger) || auto.get(c._id) || '-', c.src, c.srcNote, roc(c.aEnd), roc(c.sysClose), c.name, c.gender, c.idNo, roc(c.birth), age(c.birth), c.cms,
      c.identity, c.living, c.dementia, c.disability, c.disLevel, roc(c.applyDate), roc(c.openDate), L('referA'), L('assess'), L('visit'), L('submit'), L('supervisor'), L('approve'), L('referB'),
      svc('home'), roc(c.homeStart), e.codes || latestOf(db, c, 'codes', month), ...SVC_COLS.map(svc),
      [svc('home'), ...SVC_COLS.map(svc)].filter(isUnitName).length || '', c.area, c.address, c.contact, c.phone,
      fk && FEE[fk] ? FEE[fk].label : fk === 'unset' ? '未選' : '', roc(e.discharge), roc(e.bFirst), c.closeReason || ''];
  });
  return [SUMMARY_HEAD, ...rows];
}
function exportSummary(db, month, wholeYear) {
  const wb = XLSX.utils.book_new(), widths = SUMMARY_HEAD.map((h, i) => i === 0 ? 14 : /地址|單位|代碼/.test(h) ? 22 : 11);
  if (wholeYear) {
    const y = month.slice(0, 4);
    for (let m = 1; m <= 12; m++) { const mk = `${y}-${pad(m)}`; if (mk > todayMonth()) break; XLSX.utils.book_append_sheet(wb, sheetFromAoa(summaryAoa(db, mk), widths), rocMonth(mk)); }
    XLSX.writeFile(wb, `${+y - 1911}年個案總表.xlsx`);
  } else {
    XLSX.utils.book_append_sheet(wb, sheetFromAoa(summaryAoa(db, month), widths), rocMonth(month));
    XLSX.writeFile(wb, `${rocMonth(month)}個案總表.xlsx`);
  }
}

function SummaryView({ db, month, user, refresh }) {
  const [view, setView] = useState('list'); // list 總表 / closed 結案表
  const [q, setQ] = useState(''), [reg, setReg] = useState('全部'), [trig, setTrig] = useState('');
  const [edit, setEdit] = useState(null);
  const evOf = useMemo(() => { const m = new Map(); for (const e of db.events) if (e.month === month) m.set(e.caseId, e); return m; }, [db, month]);
  const auto = useMemo(() => autoTriggers(month, db), [db, month]);
  // 本月觸發：自己打的優先，沒有就用系統自動帶入的（11月結案、11月新案-初評…）
  const trigOf = c => { const e = evOf.get(c._id); return (e && normTrigger(e.trigger)) || auto.get(c._id) || ''; };
  const match = c => (reg === '全部' || regionOf(c.caseNo) === reg) &&
    (!q || String(c.name || '').includes(q) || String(c.idNo || '').includes(q) || String(c.caseNo).includes(q));
  const base = useMemo(() => [...db.cases.values()].filter(c => inSummaryList(c, db.info.get(c._id) || {}, month) && match(c)).sort(sortNo), [db, month, q, reg]);
  const nClosed = useMemo(() => closureList(db).length, [db]);
  const trigCounts = useMemo(() => {
    const m = new Map();
    for (const c of base) { const t = trigOf(c); m.set(t, (m.get(t) || 0) + 1); }
    const order = t => { const i = TRIGGERS.indexOf(t); return i < 0 ? 999 : i; };
    return [...m.entries()].filter(([t]) => t).sort((a, b) => order(a[0]) - order(b[0]) || a[0].localeCompare(b[0], 'zh-Hant'));
  }, [base, evOf, auto]);
  const nAny = base.filter(c => trigOf(c)).length;
  const list = trig === '' ? base : trig === '__any' ? base.filter(c => trigOf(c)) : trig === '__none' ? base.filter(c => !trigOf(c)) : base.filter(c => trigOf(c) === trig);
  const nNew = list.filter(c => isNewTrigger((evOf.get(c._id) || {}).trigger)).length;
  const feeCell = c => {
    const e = evOf.get(c._id), t = trigOf(c), x = db.info.get(c._id) || {};
    if (x.close && x.close < month) return '';                       // 之前已結案，不核銷
    const k = e && FEE[e.fee] ? e.fee : defaultFee(t);
    if (k === 'unset') return '';
    const isAuto = !(e && FEE[e.fee]);
    return html`<span class=${'tag ' + (k === 'none' ? 't-warn' : isAuto ? 't-close' : 't-ok')} title=${isAuto ? '沒選金額時的預設值' : ''}>${FEE[k].label}${isAuto ? '（預設）' : ''}</span>`;
  };
  return html`<div class="page">
    <div class="bar">
      <span class="ampm" style="margin-right:4px">
        <button class=${view === 'list' ? 'on' : ''} onClick=${() => setView('list')}>總表 ${base.length}</button>
        <button class=${view === 'closed' ? 'on' : ''} onClick=${() => setView('closed')}>結案表 ${nClosed}</button></span>
      ${view === 'list' && html`<input class="inp" style="width:220px" placeholder="搜尋姓名、身分證、編號" value=${q} onInput=${e => setQ(e.target.value)} />
      <select class="inp" value=${reg} onChange=${e => setReg(e.target.value)}>${['全部', ...Object.values(REGIONS)].map(r => html`<option value=${r}>${r}</option>`)}</select>`}
      <span class="grow"></span>
      ${view === 'list' && html`<span class="sub">共 ${list.length} 案，本月新案 ${nNew}</span>`}
      ${view === 'list' && html`<button class="btn light" onClick=${() => exportSummary(db, month, true)} title="和原本 Excel 總表一樣的欄位，一個月一張工作表">匯出${+month.slice(0, 4) - 1911}年總表</button>
        <button class="btn" onClick=${() => setEdit({ isNew: true })}>＋ 新增個案</button>`}
    </div>
    ${view === 'closed' ? html`<${ClosedView} db=${db} user=${user} refresh=${refresh} openCase=${id => setEdit({ id })} />`
    : html`
    ${db.cases.size > 0 && html`<div class="trigbar"><span class="sub">${rocMonth(month)}觸發：</span>
      ${[['', '全部', base.length], ['__any', '有觸發', nAny], ...trigCounts.map(([t, n]) => [t, t, n]), ['__none', '無觸發', base.length - nAny]].map(([k, label, n]) =>
        html`<button class=${trig === k ? 'on' : ''} onClick=${() => setTrig(trig === k && k !== '' ? '' : k)}>${label}<b>${n}</b></button>`)}</div>`}
    ${db.cases.size === 0 ? html`<div class="card empty">還沒有資料。可以到「匯入」把個案總表 Excel 匯入，或按「新增個案」。</div>` : html`
    <div class="tw"><table class="grid">
      <thead><tr><th>編號</th><th>姓名</th><th>CMS</th><th>來源</th><th>${rocMonth(month)}觸發</th><th>核銷</th><th>照專評估</th><th>訪視</th><th>照專簽審</th><th>照會B</th><th>居服單位</th><th>狀態</th></tr></thead>
      <tbody>${list.map(c => {
        const e = evOf.get(c._id), x = db.info.get(c._id) || {}, t = trigOf(c), isAuto = !(e && normTrigger(e.trigger)) && !!t;
        const closed = x.close && x.close <= month, waiting = x.close && x.close < month;
        return html`<tr class="click" onClick=${() => setEdit({ id: c._id })}>
          <td>${c.caseNo}</td><td><b>${c.name}</b></td><td>${c.cms}</td><td>${c.src}</td>
          <td>${t ? html`<span class=${'tag ' + (isNewTrigger(t) ? 't-new' : /結案/.test(t) ? 't-close' : isAuto ? 't-org' : 't-ev')} title=${isAuto ? '系統自動帶入' : ''}>${t}${isAuto ? '（自動）' : ''}</span>` : '-'}</td>
          <td>${feeCell(c)}</td>
          <td>${roc(latestOf(db, c, 'assess'))}</td><td>${roc(latestOf(db, c, 'visit'))}</td><td>${roc(latestOf(db, c, 'approve'))}</td><td>${roc(latestOf(db, c, 'referB'))}</td>
          <td>${db.resolveUnit((c.services || {}).home || '')}</td>
          <td>${closed ? html`<span class="tag t-close">${rocMonth(x.close)}結案${waiting && !closedOffMonth(c) ? '（待補結案日期）' : ''}</span>` : ''}</td></tr>`;
      })}</tbody></table></div>`}`}
    ${edit && html`<${CaseEditor} db=${db} month=${month} user=${user} id=${edit.id} onClose=${() => setEdit(null)} refresh=${refresh} />`}
  </div>`;
}

function CaseEditor({ db, month, user, id, onClose, refresh }) {
  // 新增時可能改成「沿用既有的重開案編號」，所以實際編輯的 id 用 state 記
  const [curId, setCurId] = useState(id || null);
  const orig = curId ? db.cases.get(curId) : null;

  const [kind, setKind] = useState(''), [reopen, setReopen] = useState(''), [rq, setRq] = useState(''), [reuseNote, setReuseNote] = useState('');

  const [caseNo, setCaseNo] = useState(orig ? orig.caseNo : '');
  const [c, setC] = useState(() => ({ ...(orig || {}), services: { ...((orig || {}).services || {}) } }));
  const [em, setEm] = useState(month);

  const [ev, setEv] = useState(() => ({ ...(evOrig || {}), services: { ...((evOrig || {}).services || {}) } }));
  useEffect(() => setEv({ ...(evOrig || {}), services: { ...((evOrig || {}).services || {}) } }), [evOrig]);
  const [busy, setBusy] = useState(false);
  const hist = useMemo(() => db.events.filter(e => e.caseId === curId).sort((a, b) => b.month.localeCompare(a.month)), [db, curId]);
  // 重開案：從系統裡找前幾個月的個案
  const matches = useMemo(() => {
    const t = rq.trim(); if (!t) return [];
    return [...db.cases.values()].filter(x => String(x.caseNo).includes(t) || String(x.name || '').includes(t) || String(x.idNo || '').toUpperCase().includes(t.toUpperCase())).sort(sortNo).slice(0, 8);
  }, [db, rq]);
  const pickReopen = src => {
    const no = String(src.caseNo).replace(/-\d+$/, '-2');
    const ex = [...db.cases.values()].find(x => x.caseNo === no);
    if (ex) {
      // 之前已重開過（編號尾數 2 不論重開幾次都一樣）→ 沿用那一筆，清除結案日期
      setCurId(ex._id); setC({ ...ex, aEnd: '', sysClose: '', services: { ...(ex.services || {}) } });
      setReuseNote(`編號 ${no} 之前已重開過，會沿用這一筆並清除結案日期`);
    } else {
      setCurId(null);
      const copy = {}; for (const k of BASE_COPY) if (src[k]) copy[k] = src[k];
      setC({ ...copy, services: {} }); setReuseNote(`已帶入 ${src.caseNo} 的基本資料`);
    }
    setCaseNo(no); setRq('');
  };
  const autoTrig = useMemo(() => curId ? autoTriggers(em, db).get(curId) || '' : '', [db, em, curId]);
  const chooseTrigger = t => {
    const nt = ev.trigger === t ? '' : t;
    setEv({ ...ev, trigger: nt });
    if (nt && !c.src) setC({ ...c, src: nt.includes('出備') ? '出備' : nt.includes('轉入') ? '轉入' : '初評' });
  };
  const unitNames = useMemo(() => [...new Set(db.units.map(u => u.short || u.name).filter(Boolean))], [db]);

  const diff = (a, b) => { const out = {}; for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) { if (k.startsWith('_') || k === 'caseId' || k === 'month' || k === 'caseNo') continue; if (JSON.stringify(a[k] ?? '') !== JSON.stringify(b[k] ?? '')) out[k] = b[k] ?? ''; } return out; };
  const save = async () => {
    if (isAdd && !kind) return toast('請先選擇新增方式', true);
    if (isAdd && kind === 'new' && !reopen) return toast('請選擇是否為重開案', true);
    if (isAdd && kind === 'new' && !ev.trigger) return toast('請選擇新案觸發', true);
    if (!caseNo.trim() || !parseCaseNo(caseNo)) return toast('編號格式應為 台-05-178-1', true);

          <button class=${reopen === 'yes' ? 'on' : ''} onClick=${() => { setReopen('yes'); setCaseNo(''); setReuseNote(''); }}>是，重開案<span>沿用原編號，尾數改為 2</span></button>

        <div class="form"><label>A結束服務日期<${DateInput} style="width:100%" value=${c.aEnd || ''} onChange=${v => setC({ ...c, aEnd: v })} /></label>
          <label>系統結案日期<${DateInput} style="width:100%" value=${c.sysClose || ''} onChange=${v => setC({ ...c, sysClose: v })} /></label></div>
        <div class="sub" style="margin-top:10px">結案原因</div><${ReasonPick} value=${c.closeReason || ''} onChange=${v => setC({ ...c, closeReason: v })} /></div>`}
      <div class="form">

</span>

// 匯出結案報表：總表分析、結案總表、各區結案、各區死亡結案
function exportClosures(list, yr) {
  const wb = XLSX.utils.book_new(), regs = ['四湖', '台西', '麥寮', '東勢'];
  const head = ['姓名', '身分證號', 'A個管結案', '系統結案', '結案原因', '居住地', '服務代碼'];
  const rowOf = x => [x.name, x.idNo, roc(x.aEnd), roc(x.sysClose), x.reason, x.area, x.codes];
  const st = closureStats(list);
  const A = [['總地區', '總人數'], ...regs.map(r => [r, st.byReg[r] || 0]), ['總數', regs.reduce((a, r) => a + (st.byReg[r] || 0), 0)], [], [],
    ['總結案原因', '總人數'], ...st.reasons.map(k => [k, st.byReason[k]]), ['總人數', st.total]];
  for (const r of regs) {
    const o = st.cross[r] || {}, ks = st.reasons.filter(k => o[k]);
    A.push([], [], [r, '結案分析'], ['結案原因', '人數'], ...ks.map(k => [k, o[k]]), ['總人數', ks.reduce((a, k) => a + o[k], 0)]);
  }
  XLSX.utils.book_append_sheet(wb, sheetFromAoa(A, [20, 10]), '總表分析');
  XLSX.utils.book_append_sheet(wb, sheetFromAoa([head, ...list.map(rowOf)], [10, 13, 11, 11, 18, 8, 40]), '結案總表');
  for (const r of regs) {
    const mine = list.filter(x => x.area === r);
    XLSX.utils.book_append_sheet(wb, sheetFromAoa([head, ...mine.filter(x => !isDeath(x.reason)).map(rowOf)], [10, 13, 11, 11, 18, 8, 40]), `${r}-結案`);
    XLSX.utils.book_append_sheet(wb, sheetFromAoa([head, ...mine.filter(x => isDeath(x.reason)).map(rowOf)], [10, 13, 11, 11, 18, 8, 40]), `${r}-死亡結案`);
  }
  XLSX.writeFile(wb, `${yr ? (+yr - 1911) + '年' : ''}結案總表.xlsx`);
}

// 匯出：每個服務類別一張工作表，月份一路往下，每年一列「總計」；B單位最後加「友單位總計」（最近一年、樂臨以外的單位）
function exportUnitStatBook(book, title) {
  const wb = XLSX.utils.book_new();
  for (const sh of book) {
    const aoa = [['', ...sh.cols]];
    const years = [...new Set(sh.rows.map(r => r.m.slice(0, 4)))];
    let lastTot = null;
    for (const y of years) {
      const rs = sh.rows.filter(r => r.m.startsWith(y));
      for (const r of rs) aoa.push([roc(r.m + '-01').slice(0, -3), ...sh.cols.map(c => r.v[c] || '')]);
      lastTot = sh.cols.map(c => rs.reduce((a, r) => a + (r.v[c] || 0), 0));
      aoa.push(['總計', ...lastTot]);
    }
    if (sh.cat === 'B單位' && lastTot) aoa.push(['友單位總計', sh.cols.reduce((a, c, i) => a + (/樂臨/.test(c) ? 0 : lastTot[i]), 0)]);
    XLSX.utils.book_append_sheet(wb, sheetFromAoa(aoa, [8, ...sh.cols.map(() => 16)]), sh.cat);
  }
  XLSX.writeFile(wb, `${title}.xlsx`);
}

// ================= 統計報表（派案統計、新案CMS統計、個案統計、月報、年度統計） =================
const DOCX_URL = 'https://esm.sh/docx@8.5.0', JSZIP_URL = 'https://esm.sh/jszip@3.10.1';
const downloadBlob = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); };
const fillRows = aoa => aoa.map(r => r || []);
// 讀 Word 裡的表格 → [[[格子文字]]]
async function readWordTables(buf) {
  const JSZip = (await import(JSZIP_URL)).default, zip = await JSZip.loadAsync(buf);
  const xml = await zip.file('word/document.xml').async('string'), doc = new DOMParser().parseFromString(xml, 'application/xml');
  const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main', kids = (el, n) => [...el.childNodes].filter(x => x.localName === n);
  const tables = [...doc.getElementsByTagNameNS(W, 'tbl')].filter(t => { for (let p = t.parentNode; p; p = p.parentNode) if (p.localName === 'tbl') return false; return true; });
  return tables.map(t => kids(t, 'tr').map(tr => kids(tr, 'tc').map(tc => [...tc.getElementsByTagNameNS(W, 'p')].map(p => [...p.getElementsByTagNameNS(W, 't')].map(x => x.textContent).join('')).join('\n').trim())));
}
// 產生 Word：每個月一個表格
async function buildWord(blocks, fileName) {
  const D = await import(DOCX_URL);
  const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, AlignmentType } = D;
  const para = (txt, bold) => String(txt ?? '').split('\n').map(line => new Paragraph({ children: [new TextRun({ text: line, bold: !!bold, size: 22, font: '標楷體' })] }));
  const cell = (txt, span, bold) => new TableCell({ children: para(txt, bold), columnSpan: span > 1 ? span : undefined });
  const children = [];
  blocks.forEach((rows, bi) => {
    const n = Math.max(...rows.map(r => r.reduce((a, c) => a + (c.span || 1), 0)));
    children.push(new Table({ width: { size: 100, type: WidthType.PERCENTAGE }, rows: rows.map(r => {
      const used = r.reduce((a, c) => a + (c.span || 1), 0);
      return new TableRow({ children: r.map((c, j) => cell(c.t, (c.span || 1) + (j === r.length - 1 ? n - used : 0), c.b)) });
    }) }));
    if (bi < blocks.length - 1) children.push(new Paragraph({ children: [] }), new Paragraph({ children: [] }));
  });
  downloadBlob(await Packer.toBlob(new Document({ sections: [{ children }] })), fileName);
}
const histRowsToBlock = rows => rows.map(r => r.map(t => ({ t })));
function dispatchBlock(d) {

function AoaTable({ aoa, maxCols }) {

// ================= 報表整齊顯示（只是畫面；匯出格式不變） =================
const isBlank = x => x === '' || x === null || x === undefined || (typeof x === 'string' && !x.trim());
const isNumLike = x => typeof x === 'number' || (typeof x === 'string' && /^\s*-?[\d,]+(\.\d+)?%?\s*$/.test(x));
const TOTAL_RE = /^(總計|合計|小計)/;
// 把一張 Excel/Word 表切成好幾段：空白列分段，只有一格的短文字列當標題
function aoaSections(aoa) {
  const rows = fillRows(aoa).map(r => { r = [...r]; while (r.length && isBlank(r[r.length - 1])) r.pop(); return r; });
  const out = []; let cur = null;
  const flush = () => { if (cur && cur.rows.length) out.push(cur); cur = null; };
  for (const r of rows) {
    if (!r.length) { flush(); continue; }
    const filled = r.filter(x => !isBlank(x)), t = String(filled[0] ?? '');
    if (filled.length === 1 && !isBlank(r[0]) && !isNumLike(r[0]) && t.length <= 60 && !t.includes('\n') && !TOTAL_RE.test(t) && (!cur || /[:：]\s*$/.test(t) || /\d+年/.test(t))) {
      flush(); cur = { title: t.replace(/\s*[:：]\s*$/, ''), rows: [] }; continue;
    }
    if (!cur) cur = { title: '', rows: [] };
    cur.rows.push(r);
  }
  flush(); return out;
}
const showVal = v => typeof v === 'number' && v > 0 && v < 1 && !Number.isInteger(v) ? Math.round(v * 1000) / 10 + '%' : typeof v === 'number' ? v.toLocaleString('zh-TW') : String(v ?? '');
function SecTable({ rows, hl, sumNote }) {
  const longCell = v => typeof v === 'string' && (v.includes('\n') || v.length > 30);
  const head = rows[0] || [];
  let body = rows.slice(1), tail = [];
  // 名單這種長文字（例如 指定／輪派、新案名單）不塞進表格，改放在表格下方的卡片
  const cut = body.findIndex(r => r.some(longCell) && !r.some((x, j) => j > 0 && typeof x === 'number' || (typeof x === 'string' && /^\s*\d+\s*$/.test(x))));
  if (cut >= 0) {
    let st = cut; const prev = body[cut - 1];
    if (prev && prev.every(x => isBlank(x) || (!isNumLike(x) && !longCell(x))) && !TOTAL_RE.test(String(prev[0] ?? ''))) st = cut - 1;
    tail = body.slice(st); body = body.slice(0, st);
  }
  const n = Math.max(1, ...[head, ...body].map(r => r.length));
  const labels = tail.length && !tail[0].some(longCell) ? tail.shift() : [];
  const notes = tail.flatMap(r => r.map((v, j) => [labels[j] || '', v]).filter(([, v]) => !isBlank(v)));
  const numCol = Array.from({ length: n }, (_, j) => j > 0 && body.some(r => !isBlank(r[j])) && body.every(r => isBlank(r[j]) || isNumLike(r[j])));
  return html`<div class="tw" style="max-height:none"><table class="grid rpt2">
    <thead><tr>${Array.from({ length: n }, (_, j) => html`<th class=${numCol[j] ? 'num' : ''}>${showVal(head[j])}</th>`)}</tr></thead>
    <tbody>${body.map(r => {
      const tot = TOTAL_RE.test(String(r[0] ?? '')), cur = hl && String(r[0] ?? '').trim() === hl;
      return html`<tr class=${tot ? 'tot' : cur ? 'curmonth' : ''}>${Array.from({ length: n }, (_, j) => {
        const v = r[j];

    ${notes.map(([k, v]) => html`${k && html`<h3 style="margin-top:16px">${k}</h3>`}<div class="namecards" style="margin-top:8px">${String(v).split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p => {

      if (m && m[1].length <= 30) { first = m[1]; rest = [m[2], ...rest]; }
      return html`<div class="card ncard"><div class="nhead">${first.replace(/^\(/, '')}</div>${rest.map(l => html`<div class="nnames">${l}</div>`)}</div>`; })}</div>`)}`;
}
function SmartTables({ aoa, hl }) {

function DispatchView({ d }) {

// 個案統計（系統資料）
function CaseView({ d }) {
  const groups = []; let g = [];
  for (const line of d.text) { if (line === '') { if (g.length) groups.push(g); g = []; } else g.push(line); }
  if (g.length) groups.push(g);
  // 只有一行、沒有名單的（例如「新案：17位」）當小標題；其他做成卡片
  const segs = []; let cards = [];

      ${gr.slice(1).map(l => /－\d+位$/.test(l) ? html`<div class="nsub">${l}</div>` : html`<div class="nnames">${l}</div>`)}</div>`;
  const flushCards = () => { if (cards.length) segs.push(html`<div class="namecards">${cards}</div>`); cards = []; };

// ================= 圓餅圖（跟 Google 試算表 / Excel 連線用同一份數字 publishRows） =================
const PIE_COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300', '#6250d6', '#e34948'];
const PIE_CATS = ['派案單位', '轉介樂臨', '計畫類型', '個案狀態', '地區', '性別', '身分別', '年齡', 'CMS級數', '核銷件數'];
function PieChart({ title, items }) {
  const total = items.reduce((a, [, v]) => a + (+v || 0), 0), R = 70, C = 80;
  let ang = -Math.PI / 2;
  const pt = a => `${(C + R * Math.cos(a)).toFixed(2)},${(C + R * Math.sin(a)).toFixed(2)}`;
  const pct = v => total ? Math.round(v / total * 1000) / 10 : 0;
  const slices = items.map(([k, v], i) => {
    v = +v || 0; const a0 = ang, a1 = ang + (total ? v / total : 0) * Math.PI * 2; ang = a1;
    if (!v) return null;
    const tip = `${k}：${v}（${pct(v)}%）`, col = PIE_COLORS[i % PIE_COLORS.length];
    if (v === total) return html`<circle cx=${C} cy=${C} r=${R} fill=${col}><title>${tip}</title></circle>`;
    return html`<path d=${`M${C},${C} L${pt(a0)} A${R},${R} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${pt(a1)} Z`} fill=${col} stroke="#fff" stroke-width="2" stroke-linejoin="round"><title>${tip}</title></path>`;
  });
  return html`<div class="card pie">
    <div class="pie-h">${title}<span class="sub">共 ${total}</span></div>
    ${total ? html`<div class="pie-b"><svg viewBox="0 0 160 160" width="120" height="120" role="img" aria-label=${title + '圓餅圖'}>${slices}</svg>
      <table class="pie-l">${items.map(([k, v], i) => html`<tr><td><i style=${'background:' + PIE_COLORS[i % PIE_COLORS.length]}></i>${k}</td><td class="num">${+v || 0}</td><td class="num sub">${pct(+v || 0)}%</td></tr>`)}</table></div>`
      : html`<div class="sub" style="padding:20px 0">本月沒有資料</div>`}
  </div>`;
}
function PieBoard({ rows }) {
  const by = {}; for (const [c, k, v] of rows) (by[c] = by[c] || []).push([k, v]);
  // 超過 8 項（例如派案單位）：前 7 項照列，其餘併成「其他」，顏色才不會重複
  for (const c of Object.keys(by)) if (by[c].length > 8) { const it = [...by[c]].sort((a, b) => b[1] - a[1]); by[c] = [...it.slice(0, 7), ['其他', it.slice(7).reduce((a, x) => a + (+x[1] || 0), 0)]]; }
  return html`<div class="pies">${PIE_CATS.filter(c => by[c]).map(c => html`<${PieChart} title=${c} items=${by[c]} />`)}</div>`;
}

function StatReport({ db, month, user, refresh, rkey: key, picker }) {

        XLSX.utils.book_append_sheet(wb, sheetFromAoa(fillRows(A), [8, 18, 8], [{ s: { r: 2, c: 0 }, e: { r: 2 + nU - 1, c: 0 } }, { s: { r: 31, c: 0 }, e: { r: 34, c: 0 } }, { s: { r: 52, c: 0 }, e: { r: 58, c: 0 } }]), '圓餅圖');

function guessMonth(name) {
  const s = String(name).replace(/\s/g, '');
  let m = s.match(/(\d{3})年?(\d{1,2})月?/); if (m && +m[2] >= 1 && +m[2] <= 12) return `${+m[1] + 1911}-${pad(+m[2])}`;
  m = s.match(/^(\d{1,2})月$/); if (m) return `${new Date().getFullYear()}-${pad(+m[1])}`;
  return '';
}
function ImportView({ db, user, refresh, month }) {
  const [wb, setWb] = useState(null), [fname, setFname] = useState(''), [sheet, setSheet] = useState(''), [mk, setMk] = useState(month);
  const [busy, setBusy] = useState(false), [prog, setProg] = useState(''), [result, setResult] = useState(null);
  const parsed = useMemo(() => {
    if (!wb || !sheet) return null;
    try { return parseSummarySheet(XLSX.utils.sheet_to_json(wb.Sheets[sheet], { header: 1, raw: true, defval: '' }), mk); }
    catch (e) { return { error: e.message }; }
  }, [wb, sheet, mk]);
  const pick = async f => {
    if (!f) return;
    setResult(null); setFname(f.name);
    try {
      const w = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      setWb(w); const first = w.SheetNames[w.SheetNames.length - 1]; setSheet(first); const g = guessMonth(first); if (g) setMk(g);
    } catch (e) { toast('無法讀取這個檔案：' + e.message, true); }
  };
  const byNo = useMemo(() => new Set([...db.cases.values()].map(c => c.caseNo)), [db]);
  const run = async () => {
    setBusy(true); const st = { created: 0, updated: 0, unchanged: 0, events: 0 };
    try {
      const rows = parsed.rows, B = 80;
      for (let i = 0; i < rows.length; i += B) {
        setProg(`匯入中… ${Math.min(i + B, rows.length)} / ${rows.length}`);
        const r = await call('m', 'data:importBatch', { rows: rows.slice(i, i + B).map(x => ({ caseNo: x.caseNo, caseD: JSON.stringify(x.c), month: x.month, eventD: x.e ? JSON.stringify(x.e) : undefined })), by: user });
        for (const k in st) st[k] += r[k];
      }
      await refresh(); setResult(st); toast('匯入完成');
    } catch (e) { console.error(e); toast('匯入失敗：' + e.message, true); }
    setProg(''); setBusy(false);
  };
  return html`<div class="page"><div class="card">
    <h2>匯入個案總表 Excel</h2>
    <div class="sub" style="margin-bottom:12px;line-height:1.8">一次匯入一個月份的工作表。系統用「編號」比對個案：已存在的會更新，新的會新增；Excel 空白的欄位不會把系統裡已填的資料清掉。<br/>有填「觸發」的列，會建立該月份的觸發紀錄（日期取該列的最新日期）。同一個月重複匯入不會產生重複資料。</div>
    <div class="bar"><input type="file" accept=".xlsx,.xls" onChange=${e => pick(e.target.files[0])} />
      ${wb && html`<select class="inp" value=${sheet} onChange=${e => { setSheet(e.target.value); setResult(null); const g = guessMonth(e.target.value); if (g) setMk(g); }}>${wb.SheetNames.map(n => html`<option value=${n}>${n}</option>`)}</select>
        <label class="sub">這張工作表是 <input class="inp" type="month" value=${mk} onChange=${e => { if (e.target.value) { setMk(e.target.value); setResult(null); } }} /> 的總表</label>`}</div>
    ${parsed && parsed.error && html`<div class="tag t-warn">${parsed.error}</div>`}
    ${parsed && parsed.rows && html`<div>
      <div class="chips">
        <div class="chip"><span class="sub">個案列數</span><b>${parsed.rows.length}</b></div>
        <div class="chip"><span class="sub">系統裡已有</span><b>${parsed.rows.filter(r => byNo.has(r.caseNo)).length}</b></div>
        <div class="chip"><span class="sub">新個案</span><b>${parsed.rows.filter(r => !byNo.has(r.caseNo)).length}</b></div>
        <div class="chip"><span class="sub">${rocMonth(mk)}有觸發</span><b>${parsed.rows.filter(r => r.e).length}</b></div>
      </div>
      ${parsed.unknownHeaders.length > 0 && html`<div class="sub" style="margin-bottom:8px">以下欄位系統不認得，不會匯入：${parsed.unknownHeaders.join('、')}</div>`}
      <div class="tw" style="max-height:300px"><table class="grid"><thead><tr><th>編號</th><th>姓名</th><th>觸發</th><th>照專評估</th><th>訪視</th><th>照專簽審</th><th>居服單位</th></tr></thead>
        <tbody>${parsed.rows.slice(0, 30).map(r => html`<tr><td>${r.caseNo}</td><td>${r.c.name}</td><td>${r.e ? r.e.trigger : ''}</td><td>${roc(r.c.latest.assess)}</td><td>${roc(r.c.latest.visit)}</td><td>${roc(r.c.latest.approve)}</td><td>${r.c.services.home || ''}</td></tr>`)}</tbody></table></div>
      ${parsed.rows.length > 30 && html`<div class="sub">只顯示前 30 列</div>`}
      <div class="bar" style="margin-top:12px"><button class="btn" disabled=${busy || !parsed.rows.length} onClick=${run}>${busy ? prog : `匯入 ${parsed.rows.length} 列到 ${rocMonth(mk)}`}</button>
        ${result && html`<span class="tag t-ok">完成：新增 ${result.created}、更新 ${result.updated}、未變動 ${result.unchanged}、觸發紀錄 ${result.events}</span>`}</div>
    </div>`}
    ${!wb && html`<div class="sub">${fname || '請選擇個案總表 Excel 檔'}</div>`}
  </div></div>`;
}

    try { await call('m', 'data:saveUnit', { id: edit._id, d: JSON.stringify(d), by: user }); await refresh(); setEdit(null); toast('已儲存'); }
    catch (e) { toast('儲存失敗：' + e.message, true); }

  const del = async u => { try { await call('m', 'data:remove', { table: 'units', id: u._id, by: user }); await refresh(); } catch (e) { toast('刪除失敗：' + e.message, true); } };
  // 找出資料裡出現、但還沒對應到單位主檔的名稱
  const unmatched = useMemo(() => {
    const known = new Set(db.units.map(u => u.short || u.name)), out = new Map();
    const add = raw => { if (!isUnitName(raw)) return; const r = db.resolveUnit(raw); if (!known.has(r)) out.set(r, (out.get(r) || 0) + 1); };
    for (const c of db.cases.values()) Object.values(c.services || {}).forEach(add);

    return [...out.entries()].sort((a, b) => b[1] - a[1]);

  const list = db.units.filter(u => !q || (u.name + u.short + (u.aliases || []).join()).includes(q)).sort((a, b) => (a.short || a.name).localeCompare(b.short || b.name, 'zh-Hant'));

      <div style="grid-column:1/-1"><span class="sub">服務類別</span><div class="hist" style="margin-top:4px">${CATS.map(cat => html`<button class=${(edit.cats || []).includes(cat.key) ? 'on' : ''}
        onClick=${() => { const s = new Set(edit.cats || []); s.has(cat.key) ? s.delete(cat.key) : s.add(cat.key); setEdit({ ...edit, cats: [...s] }); }}>${cat.stat}</button>`)}</div></div>
    </div><div class="bar" style="margin-top:10px"><button class="btn" onClick=${save}>儲存</button><button class="btn light" onClick=${() => setEdit(null)}>取消</button></div></div>`}
    <div class="tw" style="max-height:420px"><table class="grid"><thead><tr><th>簡稱</th><th>全名</th><th>其他寫法</th><th>類別</th><th></th></tr></thead>
      <tbody>${list.map(u => html`<tr><td><b>${u.short}</b></td><td>${u.name}</td><td class="sub">${(u.aliases || []).join('、')}</td><td>${(u.cats || []).map(k => CAT[k] ? CAT[k].stat : k).join('、')}</td>

function FloatStats({ db, month }) {
  const ms = useMemo(() => monthSummary(month, db), [db, month]);
  const [open, setOpen] = useState(null), [rg, setRg] = useState('');
  useEffect(() => { setOpen(null); }, [month]);
  const evM = useMemo(() => { const m = new Map(); for (const e of db.events) if (e.month === month) m.set(e.caseId, e); return m; }, [db, month]);
  const ITEMS = [['latest', '實際在案'], ['newCase', '新案'], ['closed', '結案']];
  const all = open ? ms.ids[open].map(id => db.cases.get(id)).sort(sortNo) : [];
  const list = rg ? all.filter(c => regionOf(c.caseNo) === rg) : all;
  const regs = Object.values(REGIONS).filter(r => all.some(c => regionOf(c.caseNo) === r));
  return html`<div>
    ${open && html`<div class="fpanel">
      <div class="bar" style="margin-bottom:6px"><b>${rocMonth(month)}・${ITEMS.find(x => x[0] === open)[1]}　${list.length} 案</b><span class="grow"></span>
        <button class="btn light sm" onClick=${() => setOpen(null)}>關閉</button></div>
      <div class="trigbar" style="margin-bottom:6px">${[['', '全部', all.length], ...regs.map(r => [r, r, all.filter(c => regionOf(c.caseNo) === r).length])].map(([k, l, n]) =>
        html`<button class=${rg === k ? 'on' : ''} onClick=${() => setRg(k)}>${l}<b>${n}</b></button>`)}</div>
      <div class="tw" style="max-height:min(56vh, 460px)"><table class="grid"><thead><tr><th>編號</th><th>姓名</th><th>地區</th><th>來源</th><th>本月觸發</th><th>開案月</th><th>結案月</th></tr></thead>
        <tbody>${list.map(c => { const x = db.info.get(c._id) || {}, e = evM.get(c._id); return html`<tr><td>${c.caseNo}</td><td><b>${c.name}</b></td><td>${regionOf(c.caseNo)}</td><td>${c.src}</td>
          <td>${e && normTrigger(e.trigger) || ''}</td><td>${x.open ? rocMonth(x.open) : ''}</td><td>${x.close ? rocMonth(x.close) : ''}</td></tr>`; })}</tbody></table></div>

    </div>
  </div>`;
}

function App() {
  const [authed, setAuthed] = useState(false), [checking, setChecking] = useState(true);
  const [user, setUser] = useState(() => { try { return localStorage.getItem('caUserName') || ''; } catch (e) { return ''; } });
  const [tab, setTab] = useState('summary'), [month, setMonth] = useState(todayMonth());
  const [db, setDb] = useState(null), [loading, setLoading] = useState(false), [toastMsg, setToastMsg] = useState(null);
  toastFn = (msg, err) => { setToastMsg({ msg, err }); setTimeout(() => setToastMsg(null), err ? 6000 : 2500); };

  const refresh = async () => {
    setLoading(true);
    try { await syncAll(); setDb(buildDb()); }
    catch (e) { console.error(e); toast('同步失敗：' + (e.message || e), true); }
    setLoading(false);
  };
  useEffect(() => { (async () => {
    if (CONFIGURED && conn.hasSaved() && await conn.fetchToken({ forceRefreshToken: false })) setAuthed(true);
    setChecking(false);
  })(); }, []);
  useEffect(() => { if (!authed) return; (async () => { await loadCache(); if (store.since.cases) setDb(buildDb()); await refresh(); })(); }, [authed]);
  // 切回這個分頁時，抓別人剛改過的資料（只抓變動的部分）
  useEffect(() => {
    if (!authed) return;
    const f = () => { if (document.visibilityState === 'visible') refresh(); };
    document.addEventListener('visibilitychange', f);
    const t = setInterval(f, 5 * 60 * 1000);
    return () => { document.removeEventListener('visibilitychange', f); clearInterval(t); };
  }, [authed]);
  const logout = async () => { try { localStorage.removeItem(REFRESH_KEY); } catch (e) { } await IDB.clear(); location.reload(); };

  if (checking) return html`<div class="empty">載入中…</div>`;
  if (!authed) return html`<${Login} onDone=${() => setAuthed(true)} />`;
  if (!user) return html`<div class="gate"><div class="box"><div style="font-weight:700;color:var(--green)">你是哪一位？</div>
    <div class="sub" style="margin-top:6px">修改紀錄會記下這個名字</div>
    <input id="nm" placeholder="請輸入你的名字" onKeyDown=${e => { if (e.key === 'Enter' && e.target.value.trim()) { localStorage.setItem('caUserName', e.target.value.trim()); setUser(e.target.value.trim()); } }} />
    <button class="btn" onClick=${() => { const v = document.getElementById('nm').value.trim(); if (v) { localStorage.setItem('caUserName', v); setUser(v); } }}>確定</button></div></div>`;

  const TABS = [['summary', '總表'], ['report', '評鑑報表'], ['stats', '統計'], ['import', '匯入'], ['settings', '設定']];
  return html`<div>
    <div class="top">
      <span class="brand"><img src=${LOGO} alt="" />雲端資料庫<a href=${PORTAL_URL}>← 回入口網頁</a></span>
      ${TABS.map(([k, l]) => html`<button class=${'tabbtn' + (tab === k ? ' on' : '')} onClick=${() => setTab(k)}>${l}</button>`)}
      <span class="grow"></span>
      <label class="sub">月份 <input class="inp" type="month" value=${month} onChange=${e => e.target.value && setMonth(e.target.value)} /></label>
      <button class="btn light" disabled=${loading} onClick=${refresh}>${loading ? '同步中…' : '重新整理'}</button>
      <span class="sub">${user}</span><button class="btn sm gray" onClick=${logout} title="登出並清除這台電腦的暫存資料">登出</button>
    </div>
    ${!db ? html`<div class="empty">第一次開啟，正在下載資料…</div>`
      : tab === 'summary' ? html`<${SummaryView} db=${db} month=${month} user=${user} refresh=${refresh} />`
      : tab === 'report' ? html`<${ReportView} db=${db} month=${month} user=${user} refresh=${refresh} />`
      : tab === 'stats' ? html`<${StatsView} db=${db} month=${month} />`
      : tab === 'import' ? html`<${ImportView} db=${db} month=${month} user=${user} refresh=${refresh} />`
      : html`<div class="page"><${HolidaysCard} db=${db} user=${user} refresh=${refresh} /><${UnitsCard} db=${db} user=${user} refresh=${refresh} /></div>`}
    ${db && html`<${FloatStats} db=${db} month=${month} />`}
    ${toastMsg && html`<div class="toast" style=${'background:' + (toastMsg.err ? 'var(--red)' : 'var(--green)')}>${toastMsg.msg}</div>`}
  </div>`;
}
render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
